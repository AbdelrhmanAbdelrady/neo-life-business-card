<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#031e31" />
  <meta name="description" content="Digital business card for Abdelrhman Abdelrady Abdelsstar, Home Automation Engineer at Neo Life." />
  <title>Abdelrhman Abdelsstar | Neo Life</title>
  <style>
    :root { color-scheme:dark; --navy:#031e31; --blue:#a8c9d8; --white:#f3f7f8; --muted:#a5bac4; --line:#29495b; --accent:#c5e2ec; --mint:#75d9c3; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:36px 20px; color:var(--white); background:radial-gradient(ellipse at 50% 8%,#16435a 0%,#08283d 38%,var(--navy) 76%); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .card { position:relative; isolation:isolate; width:min(100%,490px); border:1px solid #3c5d6c; border-radius:30px; padding:36px 40px 30px; background:linear-gradient(155deg,rgba(15,49,68,.97),rgba(3,27,44,.99) 72%); box-shadow:0 32px 90px #00111db3,inset 0 1px #ffffff0a; }
    .card::before { content:""; position:absolute; z-index:-1; inset:0; pointer-events:none; border-radius:inherit; background:radial-gradient(ellipse at 50% 0%,#a8c9d80d,transparent 58%); }
    .flip-stage { width:min(100%,490px); position:relative; perspective:1600px; transform-style:preserve-3d; transition:transform .9s cubic-bezier(.2,.7,.2,1); }
    .flip-stage.is-flipped { transform:rotateY(180deg); }
    .flip-stage > .card { width:100%; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
    .flip-stage > .card-front { position:relative; cursor:pointer; }
    .flip-stage > .card-back { position:absolute; inset:0; transform:rotateY(180deg); display:grid; place-items:center; padding:24px; overflow:hidden; cursor:pointer; }
    .card-back img { width:100%; max-height:100%; object-fit:contain; border-radius:14px; }
    .flip-trigger { border:0; background:none; font:inherit; cursor:pointer; padding:8px 0 8px 8px; }
    .flip-hint { position:absolute; right:18px; bottom:14px; color:#8aa8b6; font-size:10px; letter-spacing:.08em; pointer-events:none; }
    header { display:flex; justify-content:flex-end; align-items:center; margin-bottom:38px; }
    .brand { display:flex; align-items:center; gap:13px; color:var(--blue); }
    .brand svg { display:none; }
    .brand svg.brand-logo { display:block; width:154px; height:83px; overflow:visible; }
    .section-brand { margin:0 0 18px; }
    .brand-logo-crop { position:relative; display:block; width:160px; height:85px; overflow:hidden; }
    .brand-logo-image { position:absolute; width:380px; height:380px; max-width:none; left:-113px; top:-145px; }
    .brand-name { font-size:19px; font-weight:700; letter-spacing:.16em; line-height:1.05; }
    .brand-name span { display:block; font-size:10px; font-weight:500; letter-spacing:.38em; margin-top:5px; }
    .label { color:var(--blue); font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:12px 0 9px; font-size:clamp(28px,7vw,38px); line-height:1.12; letter-spacing:-.04em; }
    .role { margin:0; color:#bdd0d8; font-size:15px; line-height:1.6; }
    .company { margin-top:25px; display:inline-flex; align-items:center; gap:8px; color:var(--blue); font-size:13px; }
    .company:before { content:""; width:6px; height:6px; border-radius:50%; background:#9fd3dd; box-shadow:0 0 12px #9fd3dd; }
    .divider { height:1px; background:var(--line); margin:30px 0 18px; }
    .links { display:grid; gap:4px; }
    .link { display:flex; align-items:center; gap:15px; min-height:60px; padding:10px 12px; margin:0 -12px; border-radius:13px; text-decoration:none; color:var(--white); transition:background .18s, transform .18s; }
    .link:hover { background:#ffffff0b; transform:translateX(2px); }
    .icon { display:grid; place-items:center; flex:0 0 38px; height:38px; border:1px solid #345366; border-radius:11px; color:var(--blue); font-size:16px; }
    .link small { display:block; color:var(--muted); font-size:10px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:4px; }
    .link strong { font-size:13px; font-weight:550; overflow-wrap:anywhere; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:25px; }
    .button { display:flex; justify-content:center; align-items:center; gap:8px; min-height:48px; padding:12px; border:1px solid #527183; border-radius:13px; color:var(--white); font-size:12px; font-weight:650; text-decoration:none; background:#17394c; cursor:pointer; transition:background .18s; }
    .button.primary { background:var(--accent); border-color:var(--accent); color:#082235; }
    .button:hover { background:#d9edf3; color:#082235; }
    .dialog { width:min(92vw,430px); max-height:90vh; overflow:auto; border:1px solid #345366; border-radius:22px; padding:24px; color:var(--white); background:#09283b; box-shadow:0 24px 90px #00111dcc; }
    .dialog::backdrop { background:#00111dcc; backdrop-filter:blur(5px); }
    .dialog h2 { margin:0 0 6px; font-size:20px; }
    .dialog p { margin:0 0 18px; color:var(--muted); font-size:13px; }
    .card-preview { display:block; width:100%; border-radius:14px; margin:0 0 16px; }
    .card-side-label { color:var(--blue); font-size:10px; letter-spacing:.16em; text-transform:uppercase; margin:12px 0 7px; }
    .dialog-actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .dialog-actions.single { grid-template-columns:1fr; }
    .close-dialog { display:block; margin:14px auto 0; border:0; color:var(--muted); background:none; cursor:pointer; }
    footer { margin-top:28px; color:#7893a1; font-size:10px; text-align:center; letter-spacing:.08em; }
    @media(max-width:420px) { body{padding:16px}.card{padding:28px 23px;border-radius:23px} }
    /* Refined Neo Life presentation */

    .card::before { content:""; position:absolute; z-index:-1; inset:0; pointer-events:none; border-radius:inherit; background:radial-gradient(ellipse at 50% 0%,#a8c9d80d,transparent 58%); }

    .flip-trigger { padding:9px 13px; border:1px solid #52708066; border-radius:999px; background:#ffffff08; }

    main.card > section { text-align:center; }
    h1 { margin:13px 0 12px; font-size:clamp(30px,7vw,40px); line-height:1.1; letter-spacing:-.045em; }
    .role { color:#c4d6dd; line-height:1.65; }
    .company { margin-top:21px; padding:8px 14px; border:1px solid #3d5e6d; border-radius:999px; background:#ffffff06; font-size:12px; letter-spacing:.04em; }
    .divider { margin:28px 0 16px; background:linear-gradient(90deg,transparent,var(--line) 14%,var(--line) 86%,transparent); }
    .link { min-height:62px; margin:3px -5px; border:1px solid transparent; border-radius:15px; transition:background .2s,border-color .2s,transform .2s; }
    .link:hover { background:#ffffff09; border-color:#52708055; transform:translateY(-1px); }
    .icon { flex-basis:40px; height:40px; border:1px solid #446577; border-radius:13px; background:linear-gradient(145deg,#1e465a,#123348); }
    .actions { gap:11px; }
    .button { min-height:49px; border-radius:14px; background:linear-gradient(145deg,#1b4054,#143449); transition:transform .18s,background .18s,box-shadow .18s; }
    .button.primary { background:linear-gradient(135deg,#d2edf1,#a8c9d8); box-shadow:0 8px 22px #a8c9d81c; }
    .button:hover { transform:translateY(-2px); background:#e1f2f5; color:#082235; box-shadow:0 8px 20px #00111d55; }
    footer { margin-top:25px; color:#8ba4af; font-size:9px; letter-spacing:.2em; }
    @media(max-width:420px) { body{padding:16px}.card{padding:27px 22px 24px;border-radius:24px}.brand-logo-crop{transform:scale(.92)} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms!important; animation-duration:.01ms!important; } }
    .section-brand { display:none!important; }
    .company-logo-static { position:relative; width:160px; height:85px; margin:0 auto 8px; overflow:hidden; }
    .company-logo-static img { position:absolute; width:380px; height:380px; max-width:none; left:-113px; top:-145px; mix-blend-mode:lighten; }
    .company { text-decoration:none; transition:background .2s,border-color .2s,transform .2s; }
    .company:hover { background:#ffffff12; border-color:#7192a1; transform:translateY(-1px); }
    .flip-stage > .card-back { pointer-events:none; }
    .flip-stage.is-flipped > .card-front { pointer-events:none; }
    .flip-stage.is-flipped > .card-back { pointer-events:auto; }
  </style>

    async function transparentLogo(source) {
      const image = new Image(); image.src = source; await image.decode();
      const canvas = document.createElement('canvas'); canvas.width = image.naturalWidth; canvas.height = image.naturalHeight;
      const context = canvas.getContext('2d', { willReadFrequently:true }); context.drawImage(image, 0, 0);
      const pixels = context.getImageData(0, 0, canvas.width, canvas.height); const bg = pixels.data.slice(0, 3);
      for (let i = 0; i < pixels.data.length; i += 4) {
        const dr = pixels.data[i] - bg[0], dg = pixels.data[i + 1] - bg[1], db = pixels.data[i + 2] - bg[2];
        const distance = Math.sqrt(dr*dr + dg*dg + db*db);
        pixels.data[i + 3] = Math.round(pixels.data[i + 3] * Math.max(0, Math.min(1, (distance - 8) / 45)));
      }
      context.putImageData(pixels, 0, 0); return canvas.toDataURL('image/png');
    }
